name: Verify storefront
on:
  pull_request:
  push:
    branches: [main, fix/secure-checkout-google-cart]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Run website and browser checks
        run: |
          NODE_ENV=production npm start > /tmp/storefront.log 2>&1 &
          node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-preview
          path: |
            artifacts/
            /tmp/storefront.log
